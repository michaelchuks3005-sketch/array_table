<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<style>
    table {
        border-collapse: collapse;
        width: 100%;
    }

    th, td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
    }

    th {
        background-color: #f2f2f2;
    }
</style>
<body>
    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
            </tr>
        </thead>

        <tbody id="studentTable"></tbody>
    </table>
<script>
        let students = [
        {name:"", age:"", gender:""},
        {name:"Alice", age:20, gender:"Female"},
        {name:"Bob", age:22, gender:"Male"},
        {name:"Charlie", age:19, gender:"Male"},
        {name:"Diana", age:21, gender:"Female"},
        {name:"Ethan", age:23, gender:"Male"},
        {name:"Fiona", age:20, gender:"Female"},
        {name:"George", age:22, gender:"Male"},
        {name:"Hannah", age:19, gender:"Female"},
        {name:"Ian", age:21, gender:"Male"},
        {name:"Julia", age:23, gender:"Female"}

    ];
    console.log(students);


    let table = document.getElementById("studentTable");

    students.forEach(function(student) {

        table.innerHTML += `
            <tr>
                <td>${student.name}</td>
                <td>${student.age}</td>
                <td>${student.gender}</td>
            </tr>
        `;
    });
</script>

</body>
</html>
